<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>主動式 ETF 儀表板</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body class="dashboard-body">
    <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="開啟選單">選單</button>

    <div class="dashboard-shell" id="dashboardShell">
      <aside class="dashboard-sidebar" id="dashboardSidebar" aria-label="側邊導覽">
        <div class="sidebar-top">
          <a class="brand-block" href="dashboard.html" aria-label="主動式 ETF 儀表板">
            <span class="brand-mark">ETF</span>
            <span class="brand-copy">
              <strong>主動 ETF</strong>
              <small>籌碼觀測站</small>
            </span>
          </a>
          <button class="collapse-button" id="collapseButton" type="button" aria-label="收合側邊欄" title="收合側邊欄">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
        </div>

        <div class="sidebar-scroll">
          <section class="nav-section">
            <h2>追蹤ETF</h2>
            <div class="sidebar-field">
              <select id="etfSelect" aria-label="選擇 ETF"></select>
              <input id="etfInput" type="search" inputmode="latin" placeholder="輸入 ETF 代號" />
              <button id="etfSearchButton" type="button">查詢 ETF</button>
            </div>
          </section>

          <section class="nav-section">
            <h2>排行榜</h2>
            <nav class="nav-list" id="rankNav"></nav>
          </section>

          <section class="nav-section">
            <h2>追蹤個股</h2>
            <div class="sidebar-field">
              <select id="stockSelect" aria-label="選擇個股"></select>
              <input id="stockInput" type="search" inputmode="latin" placeholder="輸入股號" />
              <button id="stockSearchButton" type="button">個股查詢</button>
            </div>
          </section>

          <section class="nav-section">
            <h2>系統</h2>
            <nav class="nav-list">
              <a class="nav-item" href="#data" data-view="data" data-tooltip="數據資料" title="數據資料">
                <span class="nav-svg" data-icon="database"></span>
                <span>數據資料</span>
              </a>
              <a class="nav-item" href="#update" data-view="update" data-tooltip="數據更新" title="數據更新">
                <span class="nav-svg" data-icon="refresh"></span>
                <span>數據更新</span>
              </a>
              <a class="nav-item" href="#log" data-view="log" data-tooltip="開發日誌" title="開發日誌">
                <span class="nav-svg" data-icon="edit"></span>
                <span>開發日誌</span>
              </a>
            </nav>
          </section>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="dashboard-header">
          <div>
            <p class="eyebrow">Dashboard Preview</p>
            <h1 id="viewTitle">主動式 ETF 儀表板</h1>
            <p class="muted" id="viewHint">以資料庫最後可用交易日與前一個有效資料日比較。</p>
          </div>
          <div class="header-actions">
            <a class="text-link" href="index.html">回到舊首頁</a>
            <label class="date-control">
              <span>資料日</span>
              <select id="dataDateSelect" aria-label="選擇資料日"></select>
            </label>
          </div>
        </header>

        <section class="date-toolbar" aria-label="比較期間">
          <label>
            <span>比較起日</span>
            <select id="compareStartSelect" aria-label="選擇比較起日"></select>
          </label>
          <label>
            <span>比較迄日</span>
            <select id="compareEndSelect" aria-label="選擇比較迄日"></select>
          </label>
          <button class="primary-button" id="applyDateButton" type="button">套用期間</button>
        </section>

        <section class="dashboard-stats">
          <div class="dash-stat"><span>追蹤 ETF</span><strong id="etfCount">0</strong></div>
          <div class="dash-stat"><span>成分股</span><strong id="stockCount">0</strong></div>
          <div class="dash-stat"><span>加碼榜</span><strong id="addCount">0</strong></div>
          <div class="dash-stat"><span>比較區間</span><strong id="compareRange">-</strong></div>
        </section>

        <section class="dashboard-panel">
          <div class="panel-head">
            <div>
              <h2 id="panelTitle">持有總覽</h2>
              <p class="muted" id="panelHint">依持有 ETF 數排序。</p>
            </div>
          </div>
          <div id="dashboardContent"></div>
        </section>
      </main>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
