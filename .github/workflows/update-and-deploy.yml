name: Update ETF data and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Taiwan 18:30 = UTC 10:30.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest ETF snapshots
        run: python scripts/run_daily_auto.py

      - name: Rebuild history layers
        run: python scripts/rebuild_history.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config data public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update ETF data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
